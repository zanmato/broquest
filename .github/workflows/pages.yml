name: Publish Site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The download links point at the latest release, so the page shows that
    # version even when dispatched from a branch with an unreleased bump.
    - name: Resolve latest release
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

    - name: Build site
      run: script/build-site "${{ steps.release.outputs.tag }}"

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v4
      with:
        path: _site

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
