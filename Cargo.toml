[workspace]
members = ["crates/broquest", "crates/http-file", "crates/tree-sitter-url", "crates/vsx-themes", "crates/wsdl"]
exclude = ["vendor/llrt"]
resolver = "2"

[workspace.package]
version = "0.1.13"
edition = "2024"
authors = ["Andreas Johansson <z@zanmato.se>"]
license = "Apache-2.0"
homepage = "https://github.com/zanmato/broquest"
repository = "https://github.com/zanmato/broquest"
description = "Desktop API Client"

[workspace.dependencies]
# Core GPUI dependencies
# GPUI is published on crates.io as the `gpui-pre-*` family by the gpui-kit
# project. The [patch] at the end runs it on gpui-fast, as Blanco does.
gpui = { package = "gpui-pre", version = "0.3" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# zanmato/gpui-component, the `blanco` branch of longbridge/gpui-kit, which
# carries the single-line editor used by the URL bar. The umbrella crate puts
# the component library at `gpui_kit::component`.
gpui-kit = { git = "https://github.com/zanmato/gpui-component.git", branch = "blanco", features = [
    "tree-sitter-languages",
] }
# The component library gpui-kit re-exports, named on its own for crates that
# use it directly (vsx-themes). The same source, so Cargo builds it once.
gpui-component = { git = "https://github.com/zanmato/gpui-component.git", branch = "blanco" }

# Database dependencies
sqlx = { version = "0.8", features = [
    "runtime-async-std",
    "sqlite",
    "chrono",
    "json",
] }

# Core dependencies
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
lsp-types = "0.97"
ropey = { version = "=2.0.0-beta.1", features = ["simd"] }
env_logger = "0.11"
chrono = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = [
    "json",
    "multipart",
    "stream",
] }
base64 = "0.22"
async-compat = "0.2"
digest_auth = "0.3"
smol = "2.0"
dirs = "5"
toml = "0.8"
anyhow = "1.0"
tempfile = "3"
tree-sitter-xml = { version = "0.7" }
quick-xml = "0.37"
xsd-parser = "1.5"

# Script execution dependencies
rquickjs = { git = "https://github.com/DelSkayn/rquickjs.git", version = "0.10.0", features = [
    "parallel",
    "macro",
] }

# LLRT modules for buffer, crypto, and URL support
llrt_modules = { path = "vendor/llrt/llrt_modules", default-features = false, features = [
    "buffer",
    "crypto",
    "url",
    # Required unconditionally by llrt_modules internals (require.rs, resolver.rs),
    # even though broquest does not init these modules itself.
    "path",
    "timers",
] }

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.release]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true

[patch.crates-io]
# Run on gpui-fast instead of the gpui-pre snapshots, at the revision Blanco
# uses. Its compat crates carry the gpui-pre names and the version
# gpui-component pins, so they must move with the gpui-kit revision.
# See https://github.com/longbridge/gpui-fast/blob/main/compat/README.md
# gpui-kit's `gpui-fast` feature would do the same without a patch, but it
# compiles the gpui-pre snapshots as well.
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "8e1e1987fdb512bb8b0ab27261906a598aff2ab8" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "8e1e1987fdb512bb8b0ab27261906a598aff2ab8" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "8e1e1987fdb512bb8b0ab27261906a598aff2ab8" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "8e1e1987fdb512bb8b0ab27261906a598aff2ab8" }
