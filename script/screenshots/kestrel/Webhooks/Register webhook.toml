[meta]
name = "Register webhook"
type = "http"
seq = "2"

[http]
method = "PUT"
url = "{{baseUrl}}/v1/webhooks/:name"
auth = "none"

[[headers]]
key = "Authorization"
value = "Bearer {{token}}"
enabled = true

[[headers]]
key = "Content-Type"
value = "application/json"
enabled = true

[params.path]
name = "tracking-updates"

[body]
json = '''
{
  "url": "https://hooks.example.com/kestrel",
  "events": ["shipment.in_transit", "shipment.delivered", "shipment.exception"]
}
'''
